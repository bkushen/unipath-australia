name: Apply validated regional UI on main

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-regional-ui-main.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Apply verified regional category UI patch
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=None):
              p = Path(path)
              text = p.read_text()
              occurrences = text.count(old)
              if occurrences == 0:
                  raise SystemExit(f"Expected text not found in {path}: {old[:100]!r}")
              if count is not None and occurrences != count:
                  raise SystemExit(f"Expected {count} occurrences in {path}, found {occurrences}: {old[:100]!r}")
              p.write_text(text.replace(old, new))

          replace('lib/recommendation.ts',
              '  regional: boolean;\n  regionalVerified?: boolean;\n  annualFee: number | null;',
              '  regional: boolean;\n  regionalVerified?: boolean;\n  regionalClassification?: string | null;\n  regionalSourceUrl?: string | null;\n  regionalVerifiedAt?: string | null;\n  annualFee: number | null;', 1)

          replace('lib/course-catalog.ts',
              '  regional: boolean;\n  regional_verified: boolean;\n  living_costs?: Array<{',
              '  regional: boolean;\n  regional_verified: boolean;\n  regional_classification: string | null;\n  regional_source_url: string | null;\n  regional_verified_at: string | null;\n  living_costs?: Array<{', 1)
          replace('lib/course-catalog.ts',
              '  course_campuses(campuses(name, city, state, regional, regional_verified))',
              '  course_campuses(campuses(name, city, state, regional, regional_verified, regional_classification, regional_source_url, regional_verified_at))', 1)
          replace('lib/course-catalog.ts',
              '      regional,\n      regional_verified,\n      living_costs(category, monthly_estimate, verification_status)',
              '      regional,\n      regional_verified,\n      regional_classification,\n      regional_source_url,\n      regional_verified_at,\n      living_costs(category, monthly_estimate, verification_status)', 1)
          replace('lib/course-catalog.ts',
              '    regional: campus?.regional ?? false,\n    regionalVerified: campus?.regional_verified ?? false,\n    annualFee: fees.annualFee,',
              '    regional: campus?.regional ?? false,\n    regionalVerified: campus?.regional_verified ?? false,\n    regionalClassification: campus?.regional_classification ?? null,\n    regionalSourceUrl: campus?.regional_source_url ?? null,\n    regionalVerifiedAt: campus?.regional_verified_at ?? null,\n    annualFee: fees.annualFee,', 2)

          replace('app/results/page.tsx',
              '                  {result.feeSourceUrl && <a href={result.feeSourceUrl} target="_blank" rel="noreferrer">Fee source <ExternalLink size={13}/></a>}\n                  {result.sourceUrl && result.sourceUrl !== result.feeSourceUrl && <a href={result.sourceUrl} target="_blank" rel="noreferrer">Course source <ExternalLink size={13}/></a>}',
              '                  {result.feeSourceUrl && <a href={result.feeSourceUrl} target="_blank" rel="noreferrer">Fee source <ExternalLink size={13}/></a>}\n                  {result.regionalSourceUrl && <a href={result.regionalSourceUrl} target="_blank" rel="noreferrer">Regional source <ExternalLink size={13}/></a>}\n                  {result.sourceUrl && result.sourceUrl !== result.feeSourceUrl && <a href={result.sourceUrl} target="_blank" rel="noreferrer">Course source <ExternalLink size={13}/></a>}', 1)
          replace('app/results/page.tsx',
              'function regionalStatusLabel(course: CourseCandidate) {\n  if (!course.state && !course.city) return null;\n  if (!course.regionalVerified) return "Regional status pending";\n  return course.regional ? "Regional" : "Metropolitan";\n}',
              'function regionalStatusLabel(course: CourseCandidate) {\n  if (!course.state && !course.city) return null;\n  if (!course.regionalVerified || !course.regionalClassification) return "Regional status pending";\n  if (course.regionalClassification.startsWith("CATEGORY_2")) return "Home Affairs Category 2 · designated regional";\n  if (course.regionalClassification.startsWith("CATEGORY_3")) return "Home Affairs Category 3 · designated regional";\n  if (course.regionalClassification.startsWith("CATEGORY_1")) return "Home Affairs Category 1 · not designated regional";\n  return course.regional ? "Verified designated regional" : "Verified not designated regional";\n}', 1)

          replace('app/courses/[id]/page.tsx',
              '  course_campuses: Array<{ campuses: { name: string; city: string; state: string; regional: boolean; living_costs: LivingCost[] } | null }>;',
              '  course_campuses: Array<{ campuses: { name: string; city: string; state: string; regional: boolean; regional_classification: string | null; regional_source_url: string | null; regional_verified_at: string | null; living_costs: LivingCost[] } | null }>;', 1)
          replace('app/courses/[id]/page.tsx',
              '      course_campuses(campuses(name, city, state, regional, living_costs(category, weekly_low, weekly_high, monthly_estimate, source_url, verification_status))),',
              '      course_campuses(campuses(name, city, state, regional, regional_classification, regional_source_url, regional_verified_at, living_costs(category, weekly_low, weekly_high, monthly_estimate, source_url, verification_status))),', 1)
          replace('app/courses/[id]/page.tsx',
              '            {campus && <span><MapPin size={15}/>{campus.name} · {campus.city}, {campus.state}</span>}\n            {course.duration_months && <span><GraduationCap size={15}/>{course.duration_months / 12} years full course duration</span>}',
              '            {campus && <span><MapPin size={15}/>{campus.name} · {campus.city}, {campus.state}</span>}\n            {campus?.regional_classification && <span><Route size={15}/>{regionalCategoryLabel(campus.regional_classification)}</span>}\n            {course.duration_months && <span><GraduationCap size={15}/>{course.duration_months / 12} years full course duration</span>}', 1)
          replace('app/courses/[id]/page.tsx',
              '          {course.source_url && <a href={course.source_url} target="_blank" rel="noreferrer">Official university source <ExternalLink size={13}/></a>}\n          {!course.source_url && course.cricos_fee_source_url && <a href={course.cricos_fee_source_url} target="_blank" rel="noreferrer">Official CRICOS fee source <ExternalLink size={13}/></a>}',
              '          {course.source_url && <a href={course.source_url} target="_blank" rel="noreferrer">Official university source <ExternalLink size={13}/></a>}\n          {!course.source_url && course.cricos_fee_source_url && <a href={course.cricos_fee_source_url} target="_blank" rel="noreferrer">Official CRICOS fee source <ExternalLink size={13}/></a>}\n          {campus?.regional_source_url && <a href={campus.regional_source_url} target="_blank" rel="noreferrer">Home Affairs regional postcode source <ExternalLink size={13}/></a>}', 1)
          replace('app/courses/[id]/page.tsx',
              '            <div><ShieldCheck/><span><b>Living cost</b>{livingCost ? `${livingCost.verification_status.toLowerCase()} source range` : "Pending comparable source"}</span></div>\n            <div><ShieldCheck/><span><b>Migration evidence</b>',
              '            <div><ShieldCheck/><span><b>Living cost</b>{livingCost ? `${livingCost.verification_status.toLowerCase()} source range` : "Pending comparable source"}</span></div>\n            <div><ShieldCheck/><span><b>Regional classification</b>{campus?.regional_classification ? regionalCategoryLabel(campus.regional_classification) : "Pending current postcode verification"}</span></div>\n            <div><ShieldCheck/><span><b>Migration evidence</b>', 1)
          replace('app/courses/[id]/page.tsx',
              'function cricosFeeSummary(course: CourseDetail, annualisedFee: number | null) {',
              'function regionalCategoryLabel(category: string) {\n  if (category.startsWith("CATEGORY_2")) return "Home Affairs Category 2 · Cities and Major Regional Centres";\n  if (category.startsWith("CATEGORY_3")) return "Home Affairs Category 3 · Regional Centres and Other Regional Areas";\n  if (category.startsWith("CATEGORY_1")) return "Home Affairs Category 1 · Major city / not designated regional";\n  return category;\n}\n\nfunction cricosFeeSummary(course: CourseDetail, annualisedFee: number | null) {', 1)

          fee_canary = Path('.github/workflows/cricos-fee-canary.yml')
          if fee_canary.exists():
              text = fee_canary.read_text()
              if 'uses: actions/upload-artifact@v4' in text:
                  fee_canary.write_text(text.replace('uses: actions/upload-artifact@v4', 'uses: actions/upload-artifact@v7'))

          Path('.github/workflows/apply-regional-ui-main.yml').unlink()
          PY

      - name: Production validation
        run: |
          npm ci
          npm audit --omit=dev
          npm run typecheck
          npm run build

      - name: Commit validated application changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Expose verified regional categories in course recommendations"
          git push origin HEAD:main
