name: Generate CRICOS import chunks

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  chunk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout chunk branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - name: Generate import chunks
        run: python scripts/chunk_cricos.py

      - name: Commit chunks
        shell: bash
        run: |
          if git diff --quiet -- data/cricos/chunks && git ls-files --error-unmatch data/cricos/chunks/manifest.json >/dev/null 2>&1; then
            echo "CRICOS chunks already committed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cricos/chunks
          git commit -m "data: generate CRICOS import chunks"
          git push origin HEAD:${{ github.head_ref }}
