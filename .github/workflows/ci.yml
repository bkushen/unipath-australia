name: CRICOS bulk inspection

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect-cricos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download and inspect CRICOS snapshot
        shell: bash
        run: |
          python - <<'PY'
          import csv
          import io
          import json
          import pathlib
          import urllib.request
          import zipfile

          url = "https://data.gov.au/data/dataset/e5ae7059-bfa8-4fa4-a5c0-c13cf3520193/resource/63fd9610-5bea-438c-bac7-29289d38cfbb/download/cricos-providers-courses-locations.zip"
          out = pathlib.Path("cricos-snapshot")
          out.mkdir(exist_ok=True)
          zip_path = pathlib.Path("cricos.zip")

          request = urllib.request.Request(url, headers={"User-Agent": "UniPath-Australia-Data-Importer/0.1"})
          with urllib.request.urlopen(request, timeout=60) as response:
              zip_path.write_bytes(response.read())

          inspection = {"source_url": url, "files": []}
          with zipfile.ZipFile(zip_path) as archive:
              archive.extractall(out)

          for path in sorted(out.rglob("*")):
              if not path.is_file():
                  continue
              record = {"file": str(path.relative_to(out)), "bytes": path.stat().st_size}
              if path.suffix.lower() == ".csv":
                  raw = path.read_bytes()
                  text = None
                  encoding = None
                  for candidate in ("utf-8-sig", "utf-8", "cp1252"):
                      try:
                          text = raw.decode(candidate)
                          encoding = candidate
                          break
                      except UnicodeDecodeError:
                          pass
                  if text is None:
                      text = raw.decode("utf-8", errors="replace")
                      encoding = "utf-8-replace"
                  reader = csv.reader(io.StringIO(text))
                  rows = list(reader)
                  record["encoding"] = encoding
                  record["row_count_including_header"] = len(rows)
                  record["header"] = rows[0] if rows else []
                  record["sample_rows"] = rows[1:4]
              inspection["files"].append(record)

          pathlib.Path("cricos-inspection.json").write_text(json.dumps(inspection, indent=2, ensure_ascii=False), encoding="utf-8")
          print(json.dumps(inspection, indent=2, ensure_ascii=False))
          PY

      - name: Upload inspection
        uses: actions/upload-artifact@v7
        with:
          name: cricos-inspection
          path: cricos-inspection.json
          retention-days: 1

      - name: Upload extracted CRICOS snapshot
        uses: actions/upload-artifact@v7
        with:
          name: cricos-bulk-snapshot
          path: cricos-snapshot/
          retention-days: 1
