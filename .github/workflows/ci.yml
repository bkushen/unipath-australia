name: CRICOS bulk inspection

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect-cricos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download and inspect CRICOS CSV snapshot
        shell: bash
        run: |
          python - <<'PY'
          import csv
          import io
          import json
          import pathlib
          import urllib.request

          resources = {
              "institutions.csv": "https://data.gov.au/data/dataset/e5ae7059-bfa8-4fa4-a5c0-c13cf3520193/resource/7f6941f3-5327-4db7-b556-5f16d77f63c1/download/cricos-institutions.csv",
              "courses.csv": "https://data.gov.au/data/dataset/e5ae7059-bfa8-4fa4-a5c0-c13cf3520193/resource/48cacf69-2082-415e-9595-f17d0c3a4af0/download/cricos-courses.csv",
              "locations.csv": "https://data.gov.au/data/dataset/e5ae7059-bfa8-4fa4-a5c0-c13cf3520193/resource/45d29535-1360-4486-8242-3850e61b5524/download/cricos-locations.csv",
              "course-locations.csv": "https://data.gov.au/data/dataset/e5ae7059-bfa8-4fa4-a5c0-c13cf3520193/resource/4cd2de02-8ba3-4eb2-bac2-fe272cae3f5f/download/cricos-course-locations.csv",
          }

          out = pathlib.Path("cricos-snapshot")
          out.mkdir(exist_ok=True)
          inspection = {"snapshot_note": "Current CSV resources published by the Australian Government CRICOS dataset", "files": []}

          for filename, url in resources.items():
              path = out / filename
              request = urllib.request.Request(url, headers={"User-Agent": "UniPath-Australia-Data-Importer/0.1"})
              with urllib.request.urlopen(request, timeout=90) as response:
                  raw = response.read()
              path.write_bytes(raw)

              text = None
              encoding = None
              for candidate in ("utf-8-sig", "utf-8", "cp1252"):
                  try:
                      text = raw.decode(candidate)
                      encoding = candidate
                      break
                  except UnicodeDecodeError:
                      pass
              if text is None:
                  text = raw.decode("utf-8", errors="replace")
                  encoding = "utf-8-replace"

              reader = csv.reader(io.StringIO(text))
              header = next(reader, [])
              samples = []
              row_count = 0
              for row in reader:
                  row_count += 1
                  if len(samples) < 5:
                      samples.append(row)

              inspection["files"].append({
                  "file": filename,
                  "source_url": url,
                  "bytes": len(raw),
                  "encoding": encoding,
                  "data_row_count": row_count,
                  "header": header,
                  "sample_rows": samples,
              })

          pathlib.Path("cricos-inspection.json").write_text(json.dumps(inspection, indent=2, ensure_ascii=False), encoding="utf-8")
          print(json.dumps(inspection, indent=2, ensure_ascii=False))
          PY

      - name: Upload inspection
        uses: actions/upload-artifact@v7
        with:
          name: cricos-inspection
          path: cricos-inspection.json
          retention-days: 1

      - name: Upload CRICOS CSV snapshot
        uses: actions/upload-artifact@v7
        with:
          name: cricos-bulk-snapshot
          path: cricos-snapshot/
          retention-days: 1
