name: Promote validated IT fee batch 004

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/promote-fee-it004.yml"

permissions:
  contents: write
  actions: read

jobs:
  promote:
    if: github.event.pull_request.head.ref == 'agent/fee-it004-snapshot'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v6
        with:
          ref: agent/fee-it004-snapshot
          fetch-depth: 1

      - name: Download existing validated artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/9311434382/zip > /tmp/cricos-fee-it-004.zip
          echo "46a0cf52abf7923dca07211268441e9830ea6adc2391015888e4f15681c1b99c  /tmp/cricos-fee-it-004.zip" | sha256sum -c -
          mkdir -p /tmp/fee004
          unzip -q /tmp/cricos-fee-it-004.zip -d /tmp/fee004
          echo "f4d29381c86b614a87b52e582d69034d3c3340579d2f0c3248e470eb6600662d  /tmp/fee004/cricos-fee-it-004.json" | sha256sum -c -

      - name: Revalidate exact snapshot
        env:
          FEE_FILE: /tmp/fee004/cricos-fee-it-004.json
          MIN_PLAUSIBLE_TUITION: 100
        run: node scripts/validate-cricos-fee-snapshot.mjs

      - name: Promote snapshot and audit manifest
        run: |
          mkdir -p data/cricos/fees
          cp /tmp/fee004/cricos-fee-it-004.json data/cricos/fees/2026-08-18-it-004.json
          cat > data/cricos/fees/2026-08-18-it-004-manifest.json <<'JSON'
          {
            "source_batch": "data/cricos/chunks/courses-02-information-technology-004.json",
            "requested": 150,
            "captured_and_validated": 149,
            "held_for_review": 1,
            "minimum_plausible_tuition_aud": 100,
            "artifact_id": 9311434382,
            "workflow_run_id": 32100575875,
            "artifact_zip_sha256": "46a0cf52abf7923dca07211268441e9830ea6adc2391015888e4f15681c1b99c",
            "snapshot_sha256": "f4d29381c86b614a87b52e582d69034d3c3340579d2f0c3248e470eb6600662d",
            "tuition_min_aud": 18200,
            "tuition_max_aud": 296720,
            "held_records": [
              {"cricos_code":"096094F","reason":"CRICOS tuition 0; held by plausibility guard"}
            ]
          }
          JSON
          rm .github/workflows/promote-fee-it004.yml

      - name: Commit exact audited snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add audited fourth IT CRICOS fee snapshot"
          git push origin HEAD:agent/fee-it004-snapshot
