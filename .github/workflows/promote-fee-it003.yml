name: Promote validated IT fee batch 003

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/promote-fee-it003.yml"

permissions:
  contents: write
  actions: read

jobs:
  promote:
    if: github.event.pull_request.head.ref == 'agent/fee-it003-snapshot'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v6
        with:
          ref: agent/fee-it003-snapshot
          fetch-depth: 1

      - name: Download existing validated artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/9309765056/zip > /tmp/cricos-fee-it-003.zip
          echo "5c10adacbfa54e750c7bf24f4871b0a036d8c45c5a43603a438841dc1e10230c  /tmp/cricos-fee-it-003.zip" | sha256sum -c -
          mkdir -p /tmp/fee003
          unzip -q /tmp/cricos-fee-it-003.zip -d /tmp/fee003
          echo "79cdda0d2bcd8f5481633bbaf972f615977da1906e8b4800e2115fdb22e9beb5  /tmp/fee003/cricos-fee-it-003.json" | sha256sum -c -

      - name: Revalidate exact snapshot
        env:
          FEE_FILE: /tmp/fee003/cricos-fee-it-003.json
          MIN_PLAUSIBLE_TUITION: 100
        run: node scripts/validate-cricos-fee-snapshot.mjs

      - name: Promote snapshot and audit manifest
        run: |
          mkdir -p data/cricos/fees
          cp /tmp/fee003/cricos-fee-it-003.json data/cricos/fees/2026-08-18-it-003.json
          cat > data/cricos/fees/2026-08-18-it-003-manifest.json <<'JSON'
          {
            "source_batch": "data/cricos/chunks/courses-02-information-technology-003.json",
            "requested": 150,
            "captured_and_validated": 144,
            "held_for_review": 6,
            "minimum_plausible_tuition_aud": 100,
            "artifact_id": 9309765056,
            "workflow_run_id": 32095332561,
            "artifact_zip_sha256": "5c10adacbfa54e750c7bf24f4871b0a036d8c45c5a43603a438841dc1e10230c",
            "snapshot_sha256": "79cdda0d2bcd8f5481633bbaf972f615977da1906e8b4800e2115fdb22e9beb5",
            "tuition_min_aud": 9500,
            "tuition_max_aud": 203200,
            "held_records": [
              {"cricos_code":"067096M","reason":"CRICOS tuition 0; held by plausibility guard"},
              {"cricos_code":"073785B","reason":"CRICOS tuition 0; held by plausibility guard"},
              {"cricos_code":"111762A","reason":"CRICOS tuition 0; held by plausibility guard"},
              {"cricos_code":"111763M","reason":"CRICOS tuition 0; held by plausibility guard"},
              {"cricos_code":"111764K","reason":"CRICOS tuition 0; held by plausibility guard"},
              {"cricos_code":"111765J","reason":"CRICOS tuition 0; held by plausibility guard"}
            ]
          }
          JSON
          rm .github/workflows/promote-fee-it003.yml

      - name: Commit exact audited snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add audited third IT CRICOS fee snapshot"
          git push origin HEAD:agent/fee-it003-snapshot
