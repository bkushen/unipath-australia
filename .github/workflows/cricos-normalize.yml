name: Normalize CRICOS university snapshot

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout snapshot branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - name: Normalize current provider header variants
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/normalize_cricos.py')
          text = path.read_text()
          replacements = {
              'number(row["Number of Students"])': 'number(row.get("Number of Students") or row.get("Total Capacity") or row.get("Institution Capacity"))',
              'row["Postal City"] or None': '(row.get("Postal City") or row.get("Postal Address City")) or None',
              'row["Postal State"] or None': '(row.get("Postal State") or row.get("Postal Address State")) or None',
              'row["Postal Postcode"] or None': '(row.get("Postal Postcode") or row.get("Postal Address Postcode")) or None',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          path.write_text(text)
          PY

      - name: Generate normalized snapshot
        run: python scripts/normalize_cricos.py

      - name: Commit normalized snapshot
        shell: bash
        run: |
          if git diff --quiet -- data/cricos && git ls-files --error-unmatch data/cricos/manifest.json >/dev/null 2>&1; then
            echo "CRICOS snapshot already committed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cricos
          git commit -m "data: refresh normalized university CRICOS snapshot"
          git push origin HEAD:${{ github.head_ref }}
