name: CRICOS fee canary

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/fetch-cricos-fees.mjs"
      - "scripts/validate-cricos-fee-snapshot.mjs"
      - "supabase/migrations/**"
      - ".github/workflows/cricos-fee-canary.yml"

permissions:
  contents: read

jobs:
  fee-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Fetch third full IT CRICOS fee batch
        env:
          SOURCE_FILE: data/cricos/chunks/courses-02-information-technology-003.json
          OUTPUT_FILE: /tmp/cricos-fee-it-003.json
          LIMIT: 150
          OFFSET: 0
          DELAY_MS: 500
          MIN_PLAUSIBLE_TUITION: 100
        run: node scripts/fetch-cricos-fees.mjs

      - name: Validate captured fee snapshot
        env:
          FEE_FILE: /tmp/cricos-fee-it-003.json
          MIN_PLAUSIBLE_TUITION: 100
        run: node scripts/validate-cricos-fee-snapshot.mjs

      - name: Upload fee batch artifact
        uses: actions/upload-artifact@v7
        with:
          name: cricos-fee-it-003
          path: /tmp/cricos-fee-it-003.json
          if-no-files-found: error
          retention-days: 3
