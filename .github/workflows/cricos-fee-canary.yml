name: CRICOS fee canary

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/fetch-cricos-fees.mjs"
      - "supabase/migrations/**"
      - ".github/workflows/cricos-fee-canary.yml"

permissions:
  contents: read

jobs:
  fee-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Fetch small official CRICOS fee sample
        env:
          SOURCE_FILE: data/cricos/chunks/courses-02-information-technology-001.json
          OUTPUT_FILE: /tmp/cricos-fee-canary.json
          LIMIT: 20
          OFFSET: 0
          DELAY_MS: 500
        run: node scripts/fetch-cricos-fees.mjs

      - name: Upload fee canary artifact
        uses: actions/upload-artifact@v4
        with:
          name: cricos-fee-canary
          path: /tmp/cricos-fee-canary.json
          if-no-files-found: error
          retention-days: 3
