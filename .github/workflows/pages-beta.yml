name: Deploy public beta to GitHub Pages

# Real file change to trigger Pages after enabling GitHub Pages.
on:
  push:
    branches: [main]
    paths:
      - "public-beta/**"
      - ".github/workflows/pages-beta.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public-beta

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
