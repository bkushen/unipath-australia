name: Promote audited IT fee batch 006

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/promote-it-fee-006.yml

permissions:
  contents: write
  actions: read

jobs:
  promote:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Download existing validated artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/9311612105/zip" > /tmp/cricos-fee-it-006.zip
          mkdir -p /tmp/fee006
          unzip -q /tmp/cricos-fee-it-006.zip -d /tmp/fee006
          test -f /tmp/fee006/cricos-fee-it-006.json
      - name: Validate exact snapshot
        run: |
          MIN_PLAUSIBLE_TUITION=100 node scripts/validate-cricos-fee-snapshot.mjs /tmp/fee006/cricos-fee-it-006.json
          node - <<'NODE'
          const fs = require('fs');
          const rows = JSON.parse(fs.readFileSync('/tmp/fee006/cricos-fee-it-006.json','utf8'));
          if (rows.length !== 119) throw new Error(`Expected 119 rows, got ${rows.length}`);
          const codes = new Set(rows.map(r => String(r.cricos_code).toUpperCase()));
          if (codes.size !== 119) throw new Error('Duplicate CRICOS codes in batch 006');
          NODE
      - name: Promote immutable snapshot and manifest
        run: |
          mkdir -p data/cricos/fees
          cp /tmp/fee006/cricos-fee-it-006.json data/cricos/fees/2026-08-18-it-006.json
          ZIP_SHA=$(sha256sum /tmp/cricos-fee-it-006.zip | awk '{print $1}')
          SNAP_SHA=$(sha256sum data/cricos/fees/2026-08-18-it-006.json | awk '{print $1}')
          node - "$ZIP_SHA" "$SNAP_SHA" <<'NODE'
          const fs = require('fs');
          const [zipSha, snapSha] = process.argv.slice(2);
          const rows = JSON.parse(fs.readFileSync('data/cricos/fees/2026-08-18-it-006.json','utf8'));
          const fees = rows.map(r => Number(r.tuition_fee_total));
          const manifest = {
            source_batch: 'data/cricos/chunks/courses-02-information-technology-006.json',
            requested: 119,
            captured_and_validated: 119,
            held_for_review: 0,
            minimum_plausible_tuition_aud: 100,
            artifact_id: 9311612105,
            workflow_run_id: 32101166831,
            artifact_zip_sha256: zipSha,
            snapshot_sha256: snapSha,
            tuition_min_aud: Math.min(...fees),
            tuition_max_aud: Math.max(...fees),
            held_records: []
          };
          fs.writeFileSync('data/cricos/fees/2026-08-18-it-006-manifest.json', JSON.stringify(manifest, null, 2) + '\n');
          NODE
      - name: Remove one-use workflow and commit data only
        run: |
          rm .github/workflows/promote-it-fee-006.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cricos/fees/2026-08-18-it-006.json data/cricos/fees/2026-08-18-it-006-manifest.json .github/workflows/promote-it-fee-006.yml
          git commit -m "Add audited final IT CRICOS fee snapshot"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
